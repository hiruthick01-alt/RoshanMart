
spring.application.name=roshan-mart

server.port=${PORT:8081}
server.address=0.0.0.0

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/roshan_mart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

spring.jpa.open-in-view=false
spring.jackson.serialization.indent-output=true